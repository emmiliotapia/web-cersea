services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cersea_frontend
    restart: unless-stopped
    ports:
      - "${CERSEA_PWA_PORT:-3500}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api-core.smartopsia.com}
    networks:
      - root_default
      - cersea_network

networks:
  root_default:
    external: true
  cersea_network:
    driver: bridge
